<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Videojuegos</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- Barra de navegación  -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Tienda Gamer</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuNavbar">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="#" id="link-todos">Todos</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="link-accion">Acción</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#" id="link-aventura">Aventura</a>
          </li>
        </ul>

        <!-- busqueda -->
        <form class="d-flex" id="formulario-busqueda">
          <input class="form-control me-2" type="search" id="caja-buscar" placeholder="Buscar juego...">
          <button class="btn btn-outline-light" type="submit">Buscar</button>
        </form>
      </div>
    </div>
  </nav>

  <!-- Contenedor  -->
  <main class="container my-4">
    <!-- error carga json -->
    <div id="mensaje-error" class="alert alert-warning d-none text-center" role="alert">
      No se pudieron cargar los productos en este momento. Por favor intente más tarde.
    </div>

    <div class="row">
      <!-- catalogo -->
      <section class="col-md-8">
        <h2 class="mb-3">Catálogo</h2>
        <div class="row row-cols-1 row-cols-md-2 g-3" id="catalogo">
        </div>
      </section>

      <!-- Carrito de compra -->
      <aside class="col-md-4 mt-4 mt-md-0">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Carrito de Compras</h5>
          </div>
          <div class="card-body">
            <ul class="list-group mb-3" id="lista-carrito">
              <li class="list-group-item text-muted text-center" id="carrito-vacio">El carrito está vacío</li>
            </ul>
            <div class="d-flex justify-content-between fw-bold">
              <span>Total:</span>
              <span id="total-pagar">$0</span>
            </div>
            <button class="btn btn-danger w-100 mt-3" id="btn-vaciar">Vaciar Carrito</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <!-- Pie de página -->
  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-1">Contacto: soporte@tiendagamer.cl | Fono: +56 9 9876 5432</p>
      <p class="mb-0 text-secondary">Síguenos en redes sociales: @TiendaGamerChile</p>
    </div>
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!--  JavaScript -->
  <script src="assets/js/main.js"></script>
</body>
</html>
